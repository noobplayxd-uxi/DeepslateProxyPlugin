plugins {
    id 'java'
}

group = 'com.deepslate'
version = '1.0.0'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

task downloadBungee {
    doLast {
        def url = new URL('https://ci.md-5.net/job/BungeeCord/1522/artifact/bootstrap/target/BungeeCord.jar')
        def dest = file('libs/BungeeCord.jar')
        dest.parentFile.mkdirs()
        println "Downloading BungeeCord from $url ..."
        url.withInputStream { i -> dest.withOutputStream { it << i } }
        println "Download complete."
    }
}

compileJava.dependsOn downloadBungee

dependencies {
    compileOnly files('libs/BungeeCord.jar')
}

jar {
    archiveFileName = 'DeepslateProxyPlugin.jar'
}
